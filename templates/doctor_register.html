{% load static %}
{% include 'header.html' %}
<!-- Start Contact Us -->
<section class="contact-us section">
    <div class="container">
        <div class="inner">
            <div class="row"> 
               
                <div class="col-lg-12">
                    <div class="contact-us-form">
                        <h2>Register now</h2>
                        <!-- Form -->
                        <form class="form" method="POST" action="doctor_register" enctype="multipart/form-data">
                           {% csrf_token %}
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input type="file" name="docphoto" placeholder="Photo" required="">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input type="text" name="docname" placeholder="Name" required="">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input type="text" name="docspeciallization" placeholder="speciallization" required="">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input type="number" name="docpayment" placeholder="Fees" min="0" required="">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group" >
                                        <input type="time" name="doctiming" placeholder="timing" required="">
                                    </div>
                                </div>
                                
                                <div class="col-12">
                                    <div class="form-group login-btn">
                                        <button class="btn" type="submit">Register</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <!--/ End Form -->
                    </div>
                </div>
            </div>
        </div>
       
</section>
<!--/ End Contact Us -->

{% include 'footer.html' %}
