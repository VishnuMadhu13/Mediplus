{% load static %}
{% include 'header.html' %}

<section class="contact-us section">
    <div class="container">
        <div class="inner">
            <div class="row"> 
                <div class="col-lg-12">
                    <div class="contact-us-form">
                        <h2>user update</h2>  

```
                    <form class="form" method="POST" action="userupdates/{{result.id}}" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-lg-6">
                                
                                <!-- Show existing image -->
                                <div class="form-group">
                                    <p>Current Photo:</p>
                                    <img src="{{ result.userphoto.url }}" alt="no image" style="width:200px;height:200px;">
                                </div>

                                <!-- Optional file upload (NOT required) -->
                                <div class="form-group">
                                    <input type="file" name="userphoto" placeholder="Photo">
                                    <small>Leave empty if you don't want to change photo</small>
                                </div>

                                <div class="form-group">
                                    <input type="text" name="username" placeholder="Name" required value="{{result.username}}">
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="form-group">
                                    <input type="email" name="useremail" placeholder="Email" required value="{{result.useremail}}">
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="form-group">
                                    <input type="text" name="userphone" placeholder="Phone" required value="{{result.userphone}}">
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="form-group">
                                    <input type="password" name="userpassword" placeholder="Password" required value="{{result.userpassword}}">
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-group login-btn">
                                    <button class="btn" type="submit">Update</button>
                                </div>
                            </div>

                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
```

</section>
