apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediplus
  namespace: mediplus
  labels:
    app: mediplus
spec:
  replicas: 1   # SQLite on an emptyDir: keep a single replica
  selector:
    matchLabels:
      app: mediplus
  template:
    metadata:
      labels:
        app: mediplus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mediplus
          image: vishnumadhu13/mediplus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: mediplus.settings_container
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: SQLITE_PATH
              value: /app/data/db.sqlite3
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mediplus-secret
                  key: DJANGO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /index
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: media
          emptyDir: {}
        - name: tmp
          emptyDir: {}
